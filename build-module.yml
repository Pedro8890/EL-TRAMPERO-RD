name: Build Zygisk Module

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      # ARREGLO 5: Crear carpetas antes de generar patterns.h
      - name: Create Directories
        run: mkdir -p zygisk-module/src zygisk-module/zygisk

      # ARREGLO 3: Usar Generador_V34.lua (sin espacios)
      - name: Generate patterns.h
        run: lua5.4 "Generador_V34.lua" CODIGOS.txt zygisk-module/src/patterns.h

      # ARREGLO 4: Agregar -llog
      - name: Build arm64-v8a
        run: |
          CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++
          $CXX -shared -fPIC -O2 -std=c++17 -fvisibility=hidden \
               -Izygisk-module -Izygisk-module/src \
               zygisk-module/src/*.cpp \
               -o zygisk-module/zygisk/arm64-v8a.so -llog

      # ARREGLO 4: Agregar -llog
      - name: Build armeabi-v7a
        run: |
          CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang++
          $CXX -shared -fPIC -O2 -std=c++17 -fvisibility=hidden \
               -Izygisk-module -Izygisk-module/src \
               zygisk-module/src/*.cpp \
               -o zygisk-module/zygisk/armeabi-v7a.so -llog

      - name: Package Module Zip
        run: |
          cd zygisk-module
          zip -r ../eltrampero_rd_module.zip module.prop customize.sh zygisk/

      - name: Upload Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElTrampero_Module_Zip
          path: eltrampero_rd_module.zip
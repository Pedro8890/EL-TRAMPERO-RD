name: Build Zygisk Module
on:
  push:
    paths: ['zygisk-module/**', 'CODIGOS.txt', 'Generador_V34.lua']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Generar patterns.h
        run: lua5.4 Generador_V34.lua CODIGOS.txt zygisk-module/src/patterns.h

      - name: Compilar arm64-v8a
        run: |
          CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          $CXX -shared -fPIC -O2 -std=c++17 -fvisibility=hidden \
               -Izygisk-module -Izygisk-module/src \
               zygisk-module/src/zygisk.cpp zygisk-module/src/server.cpp zygisk-module/src/patcher.cpp \
               -o zygisk-module/zygisk/arm64-v8a.so

      - name: Compilar armeabi-v7a
        run: |
          CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang++
          $CXX -shared -fPIC -O2 -std=c++17 -fvisibility=hidden \
               -Izygisk-module -Izygisk-module/src \
               zygisk-module/src/zygisk.cpp zygisk-module/src/server.cpp zygisk-module/src/patcher.cpp \
               -o zygisk-module/zygisk/armeabi-v7a.so

      - name: Empaquetar Zip
        run: |
          cd zygisk-module
          zip -r ../eltrampero_rd_module.zip module.prop customize.sh zygisk/

      - uses: actions/upload-artifact@v4
        with:
          name: ElTrampero_Module_Zip
          path: eltrampero_rd_module.zip